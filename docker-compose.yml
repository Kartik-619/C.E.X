services:
  backend:
    build: ./backend
    environment:
      JWT_SECRET: change-me
    ports:
      - "3010:3010"
      - "3011:3011"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3010/api
        NEXT_PUBLIC_WS_URL: ws://localhost:3011
    ports:
      - "3000:3000"
    depends_on:
      - backend